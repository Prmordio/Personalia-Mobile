name: Publish Mobile Beta

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit da master (vazio = master atual)'
        required: false
        type: string
      platform:
        description: 'Plataforma'
        type: choice
        options: [both, android, ios]
        default: both

permissions:
  contents: read

concurrency:
  group: mobile-store-release
  cancel-in-progress: false

jobs:
  release:
    name: Validate & Tag
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || 'master' }}
          fetch-depth: 0

      - name: Validate release source and version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo 'ERROR: o commit selecionado deve pertencer à master.'
            exit 1
          fi
          VERSION=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '[:space:]')
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[1-9][0-9]*$ ]]; then
            echo 'ERROR: version deve usar o formato X.Y.Z+BUILD no pubspec.yaml.'
            exit 1
          fi
          TAG="mobile/v${VERSION}"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            if [ "$(git rev-parse "$TAG^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo "ERROR: $TAG já existe em outro commit. Atualize version no pubspec.yaml."
              exit 1
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Create and push tag
        id: tag
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if ! git show-ref --verify --quiet "refs/tags/$TAG"; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "refs/tags/$TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  deploy:
    name: Publish Beta
    needs: release
    uses: ./.github/workflows/mobile-deploy.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      platform: ${{ inputs.platform }}
    secrets: inherit
