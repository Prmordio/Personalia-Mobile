name: Mobile Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag para deploy (ex: mobile/v1.0.0+42)'
        required: true
        type: string
      platform:
        description: 'Plataforma'
        required: true
        type: choice
        options:
          - both
          - android
          - ios
        default: both

permissions:
  contents: read

jobs:
  android:
    name: Build & Deploy → Play Store (internal)
    runs-on: ubuntu-latest
    environment: production
    if: ${{ inputs.platform == 'both' || inputs.platform == 'android' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true

      - name: Reconstruct keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" \
            | base64 --decode \
            > "$GITHUB_WORKSPACE/upload-keystore.jks"

      - name: Reconstruct key.properties
        run: |
          cat > android/key.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/upload-keystore.jks
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build AAB
        run: |
          flutter build appbundle --release \
            --dart-define=API_BASE_URL=${{ secrets.PERSONALIA_API_URL }} \
            --dart-define=WHATSAPP_BOT_NUMBER=${{ secrets.WHATSAPP_BOT_NUMBER }}

      - name: Upload to Play Store — internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.personalia.personalia_app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

  ios:
    name: Build & Deploy → TestFlight
    runs-on: macos-latest
    environment: production
    if: ${{ inputs.platform == 'both' || inputs.platform == 'ios' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update

      - name: Build IPA
        id: build_ipa
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.DISTRIBUTION_CERT_BASE64 }}
          P12_PASSWORD: ${{ secrets.CERT_P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PERSONALIA_API_URL: ${{ secrets.PERSONALIA_API_URL }}
          WHATSAPP_BOT_NUMBER: ${{ secrets.WHATSAPP_BOT_NUMBER }}

        run: |
          set -euo pipefail
          echo "Checked-out commit: $(git rev-parse HEAD)"
          xcodebuild -version

          # ── Keychain ─────────────────────────────────────────────

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASS="ci-keychain-pass-$(date +%s)"

          echo "$CERTIFICATE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/cert.p12"

          security create-keychain \
            -p "$KEYCHAIN_PASS" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASS" \
            "$KEYCHAIN_PATH"

          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productbuild

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASS" \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH" login.keychain System.keychain

          security default-keychain \
            -s "$KEYCHAIN_PATH"

          echo "=== Signing identities ==="

          security find-identity \
            -v \
            -p codesigning


          # ── Provisioning Profile ────────────────────────────────

          echo "$PROVISIONING_PROFILE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/profile.mobileprovision"

          security cms \
            -D \
            -i "$RUNNER_TEMP/profile.mobileprovision" \
            > "$RUNNER_TEMP/profile.plist"

          PP_UUID=$(plutil \
            -extract UUID raw \
            "$RUNNER_TEMP/profile.plist")

          PP_NAME=$(plutil \
            -extract Name raw \
            "$RUNNER_TEMP/profile.plist")

          echo "Profile UUID: $PP_UUID"
          echo "Profile Name: $PP_NAME"

          [ -n "$PP_UUID" ] || {
            echo "ERROR: provisioning profile inválido"
            exit 1
          }

          [ "$PP_NAME" = "PersonaliA AppStore" ] || {
            echo "ERROR: provisioning profile incorreto"
            echo "Esperado: PersonaliA AppStore"
            echo "Recebido: $PP_NAME"
            exit 1
          }

          # Xcode 16+ uses UserData; keep the legacy location for older versions.
          for PROFILE_DIR in \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
            "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$PROFILE_DIR"
            cp "$RUNNER_TEMP/profile.mobileprovision" \
              "$PROFILE_DIR/$PP_UUID.mobileprovision"
          done

          # Configure only Runner: a global profile override also reaches Pods.
          export PP_UUID
          ruby <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
          runner = project.targets.find { |target| target.name == 'Runner' }
          abort 'ERROR: Runner target missing' unless runner
          release = runner.build_configurations.find { |config| config.name == 'Release' }
          abort 'ERROR: Runner Release configuration missing' unless release
          settings = release.build_settings
          settings['CODE_SIGN_STYLE'] = 'Manual'
          settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
          settings['DEVELOPMENT_TEAM'] = ENV.fetch('APPLE_TEAM_ID')
          settings['PROVISIONING_PROFILE_SPECIFIER'] = ENV.fetch('PP_UUID')
          settings.delete('PROVISIONING_PROFILE')
          project.save
          File.write(File.join(ENV.fetch('RUNNER_TEMP'), 'runner-bundle-id'),
                     settings.fetch('PRODUCT_BUNDLE_IDENTIFIER'))
          RUBY

          python3 <<'PY'
          import datetime, fnmatch, hashlib, os, pathlib, plistlib, subprocess
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          with (temp / 'profile.plist').open('rb') as file:
              profile = plistlib.load(file)
          def require(condition, message):
              if not condition:
                  raise SystemExit('ERROR: ' + message)
          team = os.environ['APPLE_TEAM_ID']
          bundle = (temp / 'runner-bundle-id').read_text().strip()
          entitlements = profile['Entitlements']
          app_id = entitlements.get('application-identifier', '')
          prefixes = profile.get('ApplicationIdentifierPrefix', [])
          require(team in profile.get('TeamIdentifier', []), 'Profile team differs from APPLE_TEAM_ID')
          require(any(fnmatch.fnmatchcase(prefix + '.' + bundle, app_id) for prefix in prefixes),
                  'Profile App ID does not match Runner bundle ID: ' + bundle)
          require(profile['ExpirationDate'] > datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None),
                  'Provisioning profile has expired')
          require(not entitlements.get('get-task-allow', False)
                  and 'ProvisionedDevices' not in profile
                  and not profile.get('ProvisionsAllDevices', False),
                  'Profile must be for App Store distribution')
          identities = subprocess.check_output(
              ['security', 'find-identity', '-v', '-p', 'codesigning'], text=True).upper()
          require(any(hashlib.sha1(cert).hexdigest().upper() in identities
                      for cert in profile.get('DeveloperCertificates', [])),
                  'No valid signing identity with private key matches the profile certificates')
          with open('ios/ExportOptions.plist', 'rb') as file:
              export_options = plistlib.load(file)
          export_options['teamID'] = team
          export_options['provisioningProfiles'] = {bundle: profile['UUID']}
          with (temp / 'ExportOptions.plist').open('wb') as file:
              plistlib.dump(export_options, file)
          print('Profile validated for Runner: ' + bundle)
          PY


          # ── Dart Defines ────────────────────────────────────────

          DEFINE1=$(printf '%s' \
            "API_BASE_URL=$PERSONALIA_API_URL" \
            | base64 \
            | tr -d '\n')

          DEFINE2=$(printf '%s' \
            "WHATSAPP_BOT_NUMBER=$WHATSAPP_BOT_NUMBER" \
            | base64 \
            | tr -d '\n')


          # ── Signing check ───────────────────────────────────────

          echo "=== Effective signing configuration ==="

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            -showBuildSettings \
            | grep -E \
              'DEVELOPMENT_TEAM|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE'


          # ── Archive ─────────────────────────────────────────────

          echo "=== Archiving Runner ==="

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            archive \
            CODE_SIGN_STYLE="Manual" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DART_DEFINES="$DEFINE1,$DEFINE2"


          # ── Export IPA ──────────────────────────────────────────

          echo "=== Exporting IPA ==="

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipa"

          echo "=== Generated IPA ==="

          ls -lah "$RUNNER_TEMP/ipa"

          shopt -s nullglob
          IPA_FILES=("$RUNNER_TEMP/ipa/"*.ipa)
          if [ "${#IPA_FILES[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly one exported IPA; found ${#IPA_FILES[@]}"
            exit 1
          fi
          echo "IPA selected for upload: ${IPA_FILES[0]}"
          printf 'ipa_path=%s\n' "${IPA_FILES[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ${{ steps.build_ipa.outputs.ipa_path }}
          issuer-id: ${{ secrets.APP_STORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_API_PRIVATE_KEY }}
