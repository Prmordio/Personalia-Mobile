name: Mobile Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag para deploy (ex: mobile/v1.0.0+42)'
        required: true
        type: string
      platform:
        description: 'Plataforma'
        required: true
        type: choice
        options:
          - both
          - android
          - ios
        default: both

permissions:
  contents: read

jobs:
  android:
    name: Build & Deploy → Play Store (internal)
    runs-on: ubuntu-latest
    environment: production
    if: ${{ inputs.platform == 'both' || inputs.platform == 'android' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true

      - name: Reconstruct keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > $GITHUB_WORKSPACE/upload-keystore.jks

      - name: Reconstruct key.properties
        run: |
          cat > android/key.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/upload-keystore.jks
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build AAB
        run: |
          flutter build appbundle --release \
            --dart-define=API_BASE_URL=${{ secrets.PERSONALIA_API_URL }} \
            --dart-define=WHATSAPP_BOT_NUMBER=${{ secrets.WHATSAPP_BOT_NUMBER }}

      - name: Upload to Play Store — internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.personalia.personalia_app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

  ios:
    name: Build & Deploy → TestFlight
    runs-on: macos-latest
    environment: production
    if: ${{ inputs.platform == 'both' || inputs.platform == 'ios' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: cd ios && pod install --repo-update

      - name: Build IPA
        env:
          CERTIFICATE_BASE64: ${{ secrets.DISTRIBUTION_CERT_BASE64 }}
          P12_PASSWORD: ${{ secrets.CERT_P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          PERSONALIA_API_URL: ${{ secrets.PERSONALIA_API_URL }}
          WHATSAPP_BOT_NUMBER: ${{ secrets.WHATSAPP_BOT_NUMBER }}
        run: |
          # ── Keychain ──────────────────────────────────────────────────────
          # Tudo no mesmo run: para o flutter build herdar o mesmo contexto de keychain.
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASS="ci-keychain-pass-$(date +%s)"

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productbuild
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain System.keychain
          security default-keychain -s "$KEYCHAIN_PATH"

          echo "=== Identidades disponíveis ==="
          security find-identity -v -p codesigning

          # ── Provisioning Profile ──────────────────────────────────────────
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/

          # ── Build ─────────────────────────────────────────────────────────
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist \
            --dart-define=API_BASE_URL="$PERSONALIA_API_URL" \
            --dart-define=WHATSAPP_BOT_NUMBER="$WHATSAPP_BOT_NUMBER"

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: build/ios/ipa/*.ipa
          issuer-id: ${{ secrets.APP_STORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_API_PRIVATE_KEY }}
